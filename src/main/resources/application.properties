# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Optional local overrides (git-ignored)
spring.config.import=optional:classpath:application-local.properties

# MySQL Database Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/disaster_relief_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}

# SMS Service telegram bot
sms.enabled=${SMS_ENABLED:false}
telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}
